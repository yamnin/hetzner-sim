#cloud-config
# Para cuando quieras pasar a un servidor Hetzner real:
# pégalo en "Cloud config" al crear el servidor en console.hetzner.cloud
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - ufw
runcmd:
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw --force enable
  - systemctl enable --now docker
